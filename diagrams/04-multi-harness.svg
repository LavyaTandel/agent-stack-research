<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <style>
    .box { rx: 8; ry: 8; stroke-width: 2; }
    .core { fill: #e8eaf6; stroke: #3f51b5; }
    .adapter { fill: #e8f5e9; stroke: #4caf50; }
    .harness { fill: #fff3e0; stroke: #ff9800; }
    .label { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 10px; fill: #666; text-anchor: middle; }
    .arrow { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <text x="400" y="25" class="label" font-size="16">Multi-Harness Portability (The Wedge Shape)</text>

  <rect x="300" y="50" width="200" height="60" class="box core"/>
  <text x="400" y="72" class="label">Shared Core</text>
  <text x="400" y="88" class="sub">registry + router protocol</text>
  <text x="400" y="100" class="sub">harness-agnostic</text>

  <!-- Adapters -->
  <rect x="50" y="170" width="140" height="40" class="box adapter"/>
  <text x="120" y="195" class="label" font-size="11">Adapter: OpenCode</text>

  <rect x="230" y="170" width="140" height="40" class="box adapter"/>
  <text x="300" y="195" class="label" font-size="11">Adapter: Codex CLI</text>

  <rect x="430" y="170" width="140" height="40" class="box adapter"/>
  <text x="500" y="195" class="label" font-size="11">Adapter: Grok Build</text>

  <rect x="620" y="170" width="140" height="40" class="box adapter"/>
  <text x="690" y="195" class="label" font-size="11">Adapter: Claude Code</text>

  <!-- Harnesses -->
  <rect x="50" y="260" width="140" height="40" class="box harness"/>
  <text x="120" y="285" class="label" font-size="11">OpenCode</text>

  <rect x="230" y="260" width="140" height="40" class="box harness"/>
  <text x="300" y="285" class="label" font-size="11">Codex</text>

  <rect x="430" y="260" width="140" height="40" class="box harness"/>
  <text x="500" y="285" class="label" font-size="11">Grok Build</text>

  <rect x="620" y="260" width="140" height="40" class="box harness"/>
  <text x="690" y="285" class="label" font-size="11">Claude Code</text>

  <!-- Arrows: core → adapters -->
  <line x1="340" y1="110" x2="120" y2="168" class="arrow"/>
  <line x1="380" y1="110" x2="300" y2="168" class="arrow"/>
  <line x1="420" y1="110" x2="500" y2="168" class="arrow"/>
  <line x1="460" y1="110" x2="690" y2="168" class="arrow"/>

  <!-- Arrows: adapters → harnesses -->
  <line x1="120" y1="210" x2="120" y2="258" class="arrow"/>
  <line x1="300" y1="210" x2="300" y2="258" class="arrow"/>
  <line x1="500" y1="210" x2="500" y2="258" class="arrow"/>
  <line x1="690" y1="210" x2="690" y2="258" class="arrow"/>

  <text x="400" y="340" class="sub">Thin adapters over a shared core — standards get adopted, forks get absorbed</text>
</svg>