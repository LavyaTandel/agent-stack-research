<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <style>
    .box { rx: 8; ry: 8; stroke-width: 2; }
    .before { fill: #ffebee; stroke: #f44336; }
    .after { fill: #e8f5e9; stroke: #4caf50; }
    .label { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 10px; fill: #666; text-anchor: middle; }
    .arrow { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .vs { font-size: 20px; font-weight: 700; fill: #999; text-anchor: middle; }
  </style>

  <text x="400" y="25" class="label" font-size="16">MCP 2026-07-28: Stateless Architecture</text>

  <!-- Before -->
  <text x="180" y="55" class="label" font-size="13" fill="#c62828">BEFORE (2025-11-25)</text>
  <text x="180" y="68" class="sub">stateful — session-pinned</text>

  <rect x="50" y="80" width="260" height="30" class="box before"/>
  <text x="180" y="100" class="label" font-size="11">initialize handshake</text>

  <rect x="50" y="120" width="260" height="30" class="box before"/>
  <text x="180" y="140" class="label" font-size="11">Mcp-Session-Id returned</text>

  <rect x="50" y="160" width="260" height="30" class="box before"/>
  <text x="180" y="180" class="label" font-size="11">every request → one instance</text>

  <rect x="50" y="200" width="260" height="30" class="box before"/>
  <text x="180" y="220" class="label" font-size="11">sticky sessions / session stores</text>

  <line x1="180" y1="110" x2="180" y2="118" class="arrow"/>
  <line x1="180" y1="150" x2="180" y2="158" class="arrow"/>
  <line x1="180" y1="190" x2="180" y2="198" class="arrow"/>

  <!-- VS -->
  <text x="400" y="155" class="vs">→</text>

  <!-- After -->
  <text x="620" y="55" class="label" font-size="13" fill="#2e7d32">AFTER (2026-07-28)</text>
  <text x="620" y="68" class="sub">stateless — self-contained</text>

  <rect x="490" y="80" width="260" height="30" class="box after"/>
  <text x="620" y="100" class="label" font-size="11">self-contained request + clientInfo</text>

  <rect x="490" y="120" width="260" height="30" class="box after"/>
  <text x="620" y="140" class="label" font-size="11">Mcp-Method / Mcp-Name headers</text>

  <rect x="490" y="160" width="260" height="30" class="box after"/>
  <text x="620" y="180" class="label" font-size="11">any instance handles any request</text>

  <rect x="490" y="200" width="260" height="30" class="box after"/>
  <text x="620" y="220" class="label" font-size="11">tools/list cached via ttlMs</text>

  <line x1="620" y1="110" x2="620" y2="118" class="arrow"/>
  <line x1="620" y1="150" x2="620" y2="158" class="arrow"/>
  <line x1="620" y1="190" x2="620" y2="198" class="arrow"/>

  <text x="400" y="275" class="sub">Round-robin LB, no session store — local stdio servers barely change</text>
</svg>