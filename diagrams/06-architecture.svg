<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="monospace">
  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a14"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">
    Two-Tier Skill Routing Architecture
  </text>
  
  <!-- Query input -->
  <rect x="50" y="60" width="700" height="40" rx="8" fill="#1a1a2e" stroke="#16213e"/>
  <text x="400" y="85" text-anchor="middle" fill="#ffffff" font-size="14">
    User Query: "Add hover animations to button component"
  </text>
  
  <!-- Fast Path -->
  <rect x="50" y="120" width="320" height="100" rx="8" fill="#16213e" stroke="#0f3460"/>
  <text x="210" y="145" text-anchor="middle" fill="#e94560" font-size="14" font-weight="bold">
    Fast Path (Tag + Keyword)
  </text>
  <text x="210" y="165" text-anchor="middle" fill="#a0a0a0" font-size="11">
    Tokenize query -&gt; Match tags/summary -&gt; Score
  </text>
  <text x="210" y="185" text-anchor="middle" fill="#a0a0a0" font-size="11">
    Threshold: score >= 2 -&gt; Return (&lt;1ms)
  </text>
  
  <!-- TF-IDF Fallback -->
  <rect x="430" y="120" width="320" height="100" rx="8" fill="#16213e" stroke="#0f3460"/>
  <text x="590" y="145" text-anchor="middle" fill="#e94560" font-size="14" font-weight="bold">
    TF-IDF Fallback
  </text>
  <text x="590" y="165" text-anchor="middle" fill="#a0a0a0" font-size="11">
    Cosine similarity over TF-IDF vectors
  </text>
  <text x="590" y="185" text-anchor="middle" fill="#a0a0a0" font-size="11">
    Return top-K results (~3ms)
  </text>
  
  <!-- Decision diamond -->
  <polygon points="370,170 400,155 430,170 400,185" fill="#e94560"/>
  <text x="400" y="175" text-anchor="middle" fill="#ffffff" font-size="10">
    score ≥ 2?
  </text>
  
  <!-- Arrows -->
  <line x1="400" y1="100" x2="400" y2="115" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="185" x2="400" y2="200" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210" y1="220" x2="210" y2="235" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="220" x2="590" y2="235" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Decision flow -->
  <line x1="370" y1="170" x2="400" y2="200" stroke="#a0a0a0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="385" y="185" text-anchor="middle" fill="#a0a0a0" font-size="10">No</text>
  <line x1="430" y1="170" x2="400" y2="200" stroke="#a0a0a0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="420" y="185" text-anchor="middle" fill="#a0a0a0" font-size="10">Yes</text>
  
  <!-- Results -->
  <rect x="50" y="250" width="700" height="80" rx="8" fill="#1a1a2e" stroke="#16213e"/>
  <text x="400" y="280" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">
    Ranked Skill Results
  </text>
  <text x="400" y="300" text-anchor="middle" fill="#a0a0a0" font-size="11">
    1. animate (0.92)  2. frontend-design (0.87)  3. design-taste-frontend (0.81)
  </text>
  <text x="400" y="320" text-anchor="middle" fill="#a0a0a0" font-size="11">
    Load full SKILL.md on demand → 97.2% token savings
  </text>
  
  <!-- Stats -->
  <rect x="50" y="350" width="700" height="60" rx="8" fill="#16213e" stroke="#0f3460"/>
  <text x="400" y="375" text-anchor="middle" fill="#e94560" font-size="14" font-weight="bold">
    Performance: 92% fast path, 8% TF-IDF fallback, 0.57ms avg latency
  </text>
  <text x="400" y="395" text-anchor="middle" fill="#a0a0a0" font-size="11">
    7.6K index tokens vs 273K full-body tokens (97.2% savings)
  </text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a0a0a0"/>
    </marker>
  </defs>
</svg>
