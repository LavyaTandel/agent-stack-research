<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="monospace">
  <!-- Background -->
  <rect width="800" height="500" fill="#0a0a14"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">
    Latency Comparison: Routing Approaches
  </text>
  
  <!-- Axes -->
  <line x1="80" y1="420" x2="750" y2="420" stroke="#a0a0a0" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="420" stroke="#a0a0a0" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="75" y="420" text-anchor="end" fill="#a0a0a0" font-size="12">0</text>
  <text x="75" y="370" text-anchor="end" fill="#a0a0a0" font-size="12">1</text>
  <text x="75" y="320" text-anchor="end" fill="#a0a0a0" font-size="12">2</text>
  <text x="75" y="270" text-anchor="end" fill="#a0a0a0" font-size="12">3</text>
  <text x="75" y="220" text-anchor="end" fill="#a0a0a0" font-size="12">4</text>
  <text x="75" y="170" text-anchor="end" fill="#a0a0a0" font-size="12">5</text>
  <text x="75" y="120" text-anchor="end" fill="#a0a0a0" font-size="12">6</text>
  <text x="75" y="70" text-anchor="end" fill="#a0a0a0" font-size="12">7</text>
  
  <!-- Y-axis title -->
  <text x="25" y="240" text-anchor="middle" fill="#ffffff" font-size="14" transform="rotate(-90, 25, 240)">
    Latency (ms)
  </text>
  
  <!-- X-axis labels -->
  <text x="150" y="440" text-anchor="middle" fill="#a0a0a0" font-size="12">Fast Path</text>
  <text x="400" y="440" text-anchor="middle" fill="#a0a0a0" font-size="12">TF-IDF</text>
  <text x="650" y="440" text-anchor="middle" fill="#a0a0a0" font-size="12">Two-Tier</text>
  
  <!-- Bars -->
  <!-- Fast Path avg: 0.41ms -->
  <rect x="120" y="413" width="60" height="7" fill="#4ecca3"/>
  <rect x="120" y="406" width="60" height="7" fill="#4ecca3"/>
  <text x="150" y="400" text-anchor="middle" fill="#4ecca3" font-size="12">0.41ms</text>
  <text x="150" y="418" text-anchor="middle" fill="#a0a0a0" font-size="10">avg</text>
  
  <!-- Fast Path p95: 0.66ms -->
  <rect x="120" y="395" width="60" height="25" fill="#4ecca3" opacity="0.6"/>
  <text x="150" y="392" text-anchor="middle" fill="#4ecca3" font-size="10">0.66ms</text>
  <text x="150" y="410" text-anchor="middle" fill="#a0a0a0" font-size="10">p95</text>
  
  <!-- TF-IDF avg: 2.98ms -->
  <rect x="370" y="360" width="60" height="60" fill="#e94560"/>
  <text x="400" y="355" text-anchor="middle" fill="#e94560" font-size="12">2.98ms</text>
  <text x="400" y="373" text-anchor="middle" fill="#a0a0a0" font-size="10">avg</text>
  
  <!-- TF-IDF p95: 8.18ms -->
  <rect x="370" y="290" width="60" height="130" fill="#e94560" opacity="0.6"/>
  <text x="400" y="285" text-anchor="middle" fill="#e94560" font-size="10">8.18ms</text>
  <text x="400" y="303" text-anchor="middle" fill="#a0a0a0" font-size="10">p95</text>
  
  <!-- Two-Tier avg: 0.57ms -->
  <rect x="620" y="410" width="60" height="10" fill="#9b59b6"/>
  <text x="650" y="405" text-anchor="middle" fill="#9b59b6" font-size="12">0.57ms</text>
  <text x="650" y="423" text-anchor="middle" fill="#a0a0a0" font-size="10">avg</text>
  
  <!-- Two-Tier p95: 2.53ms -->
  <rect x="620" y="380" width="60" height="40" fill="#9b59b6" opacity="0.6"/>
  <text x="650" y="375" text-anchor="middle" fill="#9b59b6" font-size="10">2.53ms</text>
  <text x="650" y="393" text-anchor="middle" fill="#a0a0a0" font-size="10">p95</text>
  
  <!-- Legend -->
  <rect x="550" y="80" width="200" height="60" rx="8" fill="#1a1a2e" stroke="#16213e"/>
  <rect x="560" y="95" width="15" height="15" fill="#4ecca3"/>
  <text x="580" y="107" fill="#a0a0a0" font-size="11">Fast Path (avg)</text>
  <rect x="560" y="115" width="15" height="15" fill="#4ecca3" opacity="0.6"/>
  <text x="580" y="127" fill="#a0a0a0" font-size="11">Fast Path (p95)</text>
  <rect x="680" y="95" width="15" height="15" fill="#e94560"/>
  <text x="700" y="107" fill="#a0a0a0" font-size="11">TF-IDF (avg)</text>
  <rect x="680" y="115" width="15" height="15" fill="#e94560" opacity="0.6"/>
  <text x="700" y="127" fill="#a0a0a0" font-size="11">TF-IDF (p95)</text>
  
  <!-- Note -->
  <text x="400" y="465" text-anchor="middle" fill="#a0a0a0" font-size="11">
    Two-tier achieves fast-path speed (0.57ms avg) with TF-IDF accuracy when needed
  </text>
</svg>
